<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d18"><title>DAI Studio — Build with AI</title>
<style>
:root{--bg:#080d18;--l:#27344a;--t:#f4f7fb;--m:#a7b4c8;--b:#5b8cff;--c:#4de0d0}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:radial-gradient(circle at 80% -10%,#1b3a73 0,transparent 40%),radial-gradient(circle at 0 110%,#0f4a55 0,transparent 35%),var(--bg);color:var(--t);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0;color:#fff;border-radius:12px;padding:11px 15px;font-weight:700;background:#202d42}
button:disabled{opacity:.5;cursor:wait}
input,textarea,select{width:100%;color:var(--t);background:#0a1220;border:1px solid var(--l);border-radius:12px;padding:12px;outline:none}
input:focus,textarea:focus{border-color:var(--b)}textarea{resize:none;min-height:50px}
.go{background:linear-gradient(135deg,#5b8cff,#4de0d0);color:#06101f}.w{width:100%;margin-top:10px}
.ghost{background:transparent;border:1px solid var(--l)}.m{color:var(--m)}.g{background:linear-gradient(90deg,#8bb0ff,#4de0d0);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand{font-weight:900;font-size:21px;letter-spacing:-.5px}.brand span{color:var(--c);margin-left:4px}
.card{background:#101827cc;border:1px solid var(--l);border-radius:20px;padding:18px;backdrop-filter:blur(10px)}
.pill{display:inline-block;border:1px solid var(--l);background:#111d30;border-radius:99px;padding:5px 12px;font-size:12px;color:#c8d7ec}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}.row select{flex:1;min-width:120px}
label{font-size:13px;color:#cbd6e6;display:block;margin:10px 0 6px}
/* auth */
#auth{min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:30px;padding:30px max(20px,5vw)}
#auth h1{font-size:clamp(34px,5vw,60px);line-height:1.04;letter-spacing:-1.5px;margin:22px 0 12px}
.seg{display:flex;gap:6px;background:#0a1220;padding:5px;border-radius:14px;margin-bottom:12px}.seg button{flex:1;background:none}.seg .on{background:#1d2c46}
.am{padding:10px 12px;border-radius:10px;background:#142c34;border:1px solid #245d60;color:#b8fff1;font-size:13px}.am.er{background:#351a27;border-color:#713044;color:#ffc5cf}
.lnk{background:none;color:var(--m);font-size:13px;width:100%;margin-top:6px}details{margin-top:14px;border-top:1px solid var(--l);padding-top:12px;font-size:13px}summary{cursor:pointer;color:#b9c7da}
/* app */
header{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#080d18d9;backdrop-filter:blur(14px);border-bottom:1px solid var(--l)}
.av{width:34px;height:34px;border-radius:50%;background:#263f66;display:grid;place-items:center;font-weight:900}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0a111ef0;backdrop-filter:blur(14px);border-top:1px solid var(--l);z-index:9}
.nb{flex:1;background:none;border-radius:0;padding:9px 2px;font-size:11px;color:var(--m);display:grid;gap:2px;justify-items:center}.nb.on{color:var(--c)}.nb i{font-style:normal;font-size:19px}
main{padding:16px 14px 90px;max-width:1300px;margin:auto}
h2{margin:6px 0 4px;font-size:26px;letter-spacing:-.6px}
.hero{text-align:center;padding:30px 0}.hero h1{font-size:clamp(34px,7vw,64px);line-height:1.04;letter-spacing:-2px;margin:18px 0 10px}
.pbox{max-width:720px;margin:26px auto 0;text-align:left;background:#101827;border:1px solid #34507f;border-radius:22px;padding:14px;box-shadow:0 0 60px #5b8cff30}
.pbox textarea{background:none;border:0;min-height:96px;font-size:16px}.pbox .row{justify-content:space-between}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{font-size:12px;padding:7px 11px;background:#17253b;border:1px solid var(--l);font-weight:500;color:#c8d7ec;border-radius:99px}
.wsbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}.wsbar b{flex:1;min-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;background:#0a1220;border-radius:12px;padding:3px}.t{background:none;padding:7px 12px;font-size:13px;color:var(--m)}.t.on{background:#1d2c46;color:#fff}
.ic{padding:8px 11px;background:#17253b;border:1px solid var(--l)}
#ws{height:calc(100vh - 200px);min-height:460px}#ws>div{display:none;height:100%;flex-direction:column;border:1px solid var(--l);border-radius:18px;overflow:hidden;background:#0c1422}
#ws[data-t=chat] #chatP,#ws[data-t=preview] #prevP,#ws[data-t=code] #codeP{display:flex}
.msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}.msg{padding:9px 13px;border-radius:15px;max-width:90%;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--b)}.msg.a{align-self:flex-start;background:#131f33;border:1px solid var(--l)}.typing{opacity:.75;font-style:italic}
.cin{display:flex;gap:8px;padding:10px;border-top:1px solid var(--l);align-items:flex-end}
.dev{display:flex;gap:6px;padding:8px;border-bottom:1px solid var(--l);justify-content:center}
.frame{flex:1;display:flex;justify-content:center;background:#05080f;overflow:auto}.frame iframe{width:100%;height:100%;border:0;background:#fff;transition:max-width .2s}
#ce{flex:1;border:0;border-radius:0;font:12.5px/1.5 ui-monospace,Consolas,monospace;resize:none;background:#070c16}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:14px}.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:14px}
.imgs img{width:100%;border-radius:14px;display:block;background:#0a1220;min-height:160px}.pre{white-space:pre-wrap;line-height:1.6;margin-top:12px}
.toasts{position:fixed;bottom:80px;left:14px;right:14px;display:grid;gap:8px;justify-items:center;z-index:50;pointer-events:none}
.toast{background:#142c34;border:1px solid #245d60;color:#b8fff1;padding:10px 14px;border-radius:12px;font-size:13px;max-width:380px}.toast.er{background:#351a27;border-color:#713044;color:#ffc5cf}
@media(min-width:900px){nav{top:0;right:auto;width:84px;flex-direction:column;border-top:0;border-right:1px solid var(--l);padding-top:64px}.nb{flex:none;padding:14px 0}main{padding:20px 24px 24px 108px}header{padding-left:108px}.brand{position:fixed;left:16px;top:14px}
#ws{display:grid;grid-template-columns:380px 1fr;gap:12px}#chatP{display:flex!important}#ws[data-t=chat] #prevP{display:flex}#prevP,#codeP{grid-column:2;grid-row:1}.tchat{display:none}}
@media(max-width:899px){#auth{grid-template-columns:1fr;padding-top:24px}}
</style></head><body>
<div id="auth"><div><div class="brand">DAI<span>STUDIO</span></div><h1>Build websites,<br><span class="g">apps &amp; visuals</span> with AI.</h1><p class="m">Describe it. DAI builds it, live, in seconds.</p></div>
<div class="card"><div class="seg"><button id="m1" class="on">Sign up</button><button id="m2">Log in</button></div>
<div id="s1"><label for="em">Email address</label><input id="em" type="email" placeholder="you@example.com" autocomplete="email"><button id="sc" class="go w">Send verification code</button></div>
<div id="s2" hidden><p class="m">Enter the code we sent to <b id="to"></b></p><input id="ot" inputmode="numeric" maxlength="8" placeholder="Verification code" autocomplete="one-time-code"><button id="vf" class="go w">Verify &amp; continue</button><button id="rs" class="ghost w">Resend code</button><button id="bk" class="lnk">Change email</button></div>
<p id="am" class="am" hidden style="margin-top:12px"></p>
<details id="cfg"><summary>Connect Supabase</summary><label>Project URL</label><input id="cu" placeholder="https://your-project.supabase.co"><label>Publishable key</label><input id="ck" placeholder="sb_publishable_..." autocomplete="off"><button id="cs0" class="w">Save connection</button></details></div></div>
<div id="app" hidden><header><div class="brand">DAI<span>STUDIO</span></div><div id="av" class="av">D</div></header><main id="v"></main>
<nav><button class="nb" data-v="build"><i>✦</i>Build</button><button class="nb" data-v="projects"><i>▣</i>Projects</button><button class="nb" data-v="images"><i>▧</i>Images</button><button class="nb" data-v="video"><i>▶</i>Video</button><button class="nb" data-v="account"><i>⚙</i>Account</button></nav></div>
<div id="toasts" class="toasts"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),K='davidAI_workspace_v2',SYS='You are DAI Builder, an expert web designer and developer. Reply with ONE complete, self-contained HTML document only (inline CSS and JS, no markdown, no explanation). Make it modern, beautiful, mobile-responsive, with real persuasive copy, clear sections and subtle animations. For images use https://image.pollinations.ai/prompt/<url-encoded description>?width=1200&height=800&nologo=true . Use no external scripts except Google Fonts.Animations must never hide content: elements must be fully visible by default (no opacity:0 in base CSS). Use CSS keyframe animations that end visible, or add the hidden state only through JavaScript after load. Give every hero a solid or gradient background color so it still looks good if images are slow. When given CURRENT CODE, apply the requested change and return the full updated document.';
let S=(()=>{let s={};try{s=JSON.parse(localStorage.getItem(K))||{}}catch(e){}return{projects:[],...s,settings:{supabaseUrl:'',supabaseKey:'',...(s.settings||{})}}})();
let sb=null,user=null,view='build',wt='chat',busy=false,mode='signup',mail='',cool=null;
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('Storage is full. Delete old projects.',1)}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m,e){const t=document.createElement('div');t.className='toast'+(e?' er':'');t.textContent=m;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),e?5000:2600)}
function connect(){const u=(S.settings.supabaseUrl||'').trim().replace(/\/$/,''),k=(S.settings.supabaseKey||'').trim();if(!u||!k||!window.supabase)return false;sb=supabase.createClient(u,k,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});return true}
/* ---- auth ---- */
function am(t,e){const x=$('#am');x.hidden=!t;x.textContent=t||'';x.className='am'+(e?' er':'')}
function step(n){$('#s1').hidden=n!==1;$('#s2').hidden=n!==2}
function setMode(m){mode=m;$('#m1').classList.toggle('on',m==='signup');$('#m2').classList.toggle('on',m==='login');$('#sc').textContent=m==='signup'?'Send verification code':'Send login code';am('');step(1)}
function startCool(){let n=45;const b=$('#rs');b.disabled=true;clearInterval(cool);cool=setInterval(()=>{b.textContent=n>0?'Resend code ('+n--+'s)':'Resend code';if(n<0){b.disabled=false;clearInterval(cool)}},1000)}
async function sendCode(resend){const e=resend?mail:$('#em').value.trim();if(!/^\S+@\S+\.\S+$/.test(e))return am('Enter a valid email address.',1);
 try{if(!connect())throw Error('Open "Connect Supabase" below and save your project URL and key.');$('#sc').disabled=true;
  const{error}=await sb.auth.signInWithOtp({email:e,options:{shouldCreateUser:mode==='signup'}});if(error)throw error;
  mail=e;$('#to').textContent=e;step(2);am('Code sent. Check your inbox and spam folder.');startCool()}catch(x){am(x.message,1)}$('#sc').disabled=false}
async function verify(){const t=$('#ot').value.trim();if(!/^\d{6,8}$/.test(t))return am('Enter the code from your email.',1);
 try{if(!sb&&!connect())throw Error('Supabase is not connected.');const{data,error}=await sb.auth.verifyOtp({email:mail,token:t,type:'email'});if(error)throw error;enter(data.user)}catch(x){am(x.message,1)}}
function enter(u){user=u;$('#auth').hidden=true;$('#app').hidden=false;$('#av').textContent=(u?.email||'D')[0].toUpperCase();render()}
function showAuth(){user=null;$('#app').hidden=true;$('#auth').hidden=false;setMode('signup')}
async function signOut(){try{await sb?.auth.signOut()}catch(e){}showAuth()}
/* ---- data ---- */
function cur(){const p=S.projects.find(x=>x.id===S.cur);if(p){p.chat=p.chat||[];p.versions=p.versions||[];p.code=p.code||{html:'',css:'',js:''}}return p}
function newP(t){const p={id:'p'+Date.now(),name:(t||'Untitled').slice(0,40),type:'Website',date:new Date().toLocaleDateString(),code:{html:'',css:'',js:''},versions:[],chat:[]};S.projects.unshift(p);S.cur=p.id;save();return p}
function docOf(p){const c=p.code||{};if(/<html|<!doctype/i.test(c.html||''))return c.html;if(!(c.html||c.css||c.js))return'';return`<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>${c.css||''}</style></head><body>${c.html||''}<script>${c.js||''}<\/script></body></html>`}
function extract(t){t=t.replace(/```(?:html)?/gi,'');const i=t.search(/<!doctype|<html/i);if(i<0)return'';let h=t.slice(i);const e=h.toLowerCase().lastIndexOf('</html>');if(e>0)h=h.slice(0,e+7);return h.trim()}
async function ask(content){if(!sb&&!connect())throw Error('Connect Supabase first (Account tab).');
 const{data}=await sb.auth.getSession(),t=data?.session?.access_token;if(!t)throw Error('Please log in again.');
 const u=S.settings.supabaseUrl.trim().replace(/\/$/,'');
 const r=await fetch(u+'/functions/v1/smart-endpoint',{method:'POST',headers:{Authorization:'Bearer '+t,apikey:S.settings.supabaseKey.trim(),'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content}]})});
 const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Server error '+r.status);return d.reply||''}
async function gen(text){text=(text||'').trim();if(!text||busy)return;const p=cur()||newP(text);if(p.name==='Untitled')p.name=text.slice(0,40);
 p.chat.push({r:'u',t:text});busy=true;view='build';wt='chat';save();render();
 const have=docOf(p);
 try{const rep=await ask(SYS+(have?`\n\nCURRENT CODE:\n${have}\n\nCHANGE REQUEST: ${text}`:`\n\nBUILD THIS: ${text}`)),h=extract(rep);
  if(h){if(have){p.versions.push(have);p.versions=p.versions.slice(-8)}p.code={html:h,css:'',js:''};p.chat.push({r:'a',t:have?'✓ Updated. Check the preview.':'✓ Your site is ready. Open the Preview tab, or ask me for changes.'});wt='preview'}
  else p.chat.push({r:'a',t:'I could not build that. Try describing it differently.'})}
 catch(e){p.chat.push({r:'a',t:'⚠ '+e.message});toast(e.message,1)}
 busy=false;save();if(view==='build')render()}
/* ---- views ---- */
function msgs(p){return(p.chat.length?p.chat.map(m=>`<div class="msg ${m.r}">${esc(m.t)}</div>`).join(''):'<p class="m">Describe a change to your site.</p>')+(busy?'<div class="msg a typing">Building… this can take up to a minute</div>':'')}
function vBuild(){const p=cur();if(!p||(!docOf(p)&&!p.chat.length))return`<section class="hero"><span class="pill">✦ AI website builder</span><h1>Build anything.<br><span class="g">Just describe it.</span></h1><p class="m">Turn an idea into a live, editable website in seconds.</p><div class="pbox"><textarea id="hp" placeholder="Describe the website you want to build…"></textarea><div class="row"><div class="chips">${['Portfolio for a photographer','Restaurant landing page','Online sneaker store','Fitness coaching site'].map(c=>`<button class="chip" data-c="${c}">${c}</button>`).join('')}</div><button id="hg" class="go">Build ➜</button></div></div></section>`;
 return`<div class="wsbar"><b>${esc(p.name)}</b><div class="tabs"><button class="t tchat" data-t="chat">Chat</button><button class="t" data-t="preview">Preview</button><button class="t" data-t="code">Code</button></div><button class="ic" id="undo" title="Undo">↶</button><button class="ic" id="open" title="Open full">⤢</button><button class="ic" id="copy" title="Copy code">⧉</button><button class="ic" id="dl" title="Download">⬇</button></div>
<div id="ws" data-t="${wt}"><div id="chatP"><div id="msgs" class="msgs">${msgs(p)}</div><div class="cin"><textarea id="ci" placeholder="Ask for a change… e.g. make the hero darker"></textarea><button id="cs" class="go">➜</button></div></div>
<div id="prevP"><div class="dev"><button class="ic" data-w="100%">🖥 Desktop</button><button class="ic" data-w="390px">📱 Mobile</button></div><div class="frame"><iframe id="fr" sandbox="allow-scripts allow-forms allow-popups allow-modals"></iframe></div></div>
<div id="codeP"><textarea id="ce" spellcheck="false"></textarea></div></div>`}
function vProjects(){return`<div class="row" style="justify-content:space-between"><div><h2>Projects</h2><p class="m" style="margin:0">Saved in this browser.</p></div><button id="np" class="go">＋ New</button></div><div class="grid">${S.projects.map(p=>`<div class="card"><b>${esc(p.name)}</b><div class="m" style="font-size:12px">${esc(p.type||'Website')} · ${esc(p.date||'')}</div><div class="row"><button data-o="${p.id}" class="go">Open</button><button data-r="${p.id}">Rename</button><button data-d="${p.id}">Delete</button></div></div>`).join('')||'<p class="m">No projects yet. Go to Build and describe your first site.</p>'}</div>`}
function vImages(){return`<h2>Image Studio</h2><p class="m">Describe an image and DAI creates it (free service, can be slow at busy times).</p><div class="card"><textarea id="ip" placeholder="A neon-lit street in Lagos at night, cinematic…"></textarea><div class="row"><select id="is"><option value="">Auto style</option><option>photorealistic</option><option>3d render</option><option>flat illustration</option><option>anime</option><option>oil painting</option></select><select id="iz"><option value="1024x1024">Square</option><option value="1280x720">Wide</option><option value="720x1280">Tall</option></select><button id="ig" class="go">Generate</button></div></div><div id="io" class="imgs"></div>`}
function vVideo(){return`<h2>Video Studio</h2><p class="m">Real video rendering needs a paid provider. This writes a full scene-by-scene storyboard, script and shot list you can use in any video tool.</p><div class="card"><textarea id="vp" placeholder="A 30-second ad for a Lagos coffee brand…"></textarea><div class="row"><button id="vg" class="go">Create storyboard</button><button id="vc" class="ghost">Copy</button></div></div><div id="vo" class="pre"></div>`}
function vAccount(){return`<h2>Account</h2><div class="card"><b>${esc(user?.email||'')}</b><p class="m">Signed in. Your projects are saved in this browser.</p><div class="row"><a href="admin/"><button>Admin dashboard</button></a><button id="so">Sign out</button></div></div><div class="card" style="margin-top:12px"><b>Supabase connection</b><label>Project URL</label><input id="au" value="${esc(S.settings.supabaseUrl)}"><label>Publishable key</label><input id="ak" value="${esc(S.settings.supabaseKey)}" autocomplete="off"><div class="row"><button id="as" class="go">Save</button><button id="ex">Export backup</button></div></div>`}
function render(){$('#v').innerHTML=({build:vBuild,projects:vProjects,images:vImages,video:vVideo,account:vAccount}[view]||vBuild)();document.querySelectorAll('.nb').forEach(b=>b.classList.toggle('on',b.dataset.v===view));bind()}
function setT(t){wt=t;const w=$('#ws');if(w)w.dataset.t=t;document.querySelectorAll('.t').forEach(b=>b.classList.toggle('on',b.dataset.t===t||(t==='chat'&&matchMedia('(min-width:900px)').matches&&b.dataset.t==='preview')))}
const dl=(n,c,t)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:t}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)};
function copy(t){if(!t)return toast('Nothing to copy yet.',1);(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Copied.')).catch(()=>{const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();document.execCommand('copy');x.remove();toast('Copied.')})}
function bind(){
 if(view==='build'){const p=cur();
  if($('#hg')){$('#hg').onclick=()=>gen($('#hp').value);document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{$('#hp').value='Build a '+b.dataset.c.toLowerCase()+' with a stunning hero, features, testimonials and contact section'});return}
  const d=docOf(p);$('#fr').srcdoc=d;$('#ce').value=d;setT(wt);
  document.querySelectorAll('.t').forEach(b=>b.onclick=()=>setT(b.dataset.t));
  document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{$('#fr').style.maxWidth=b.dataset.w});
  const send=()=>{const v=$('#ci').value;$('#ci').value='';gen(v)};$('#cs').onclick=send;$('#cs').disabled=busy;
  $('#ci').onkeydown=e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();send()}};
  const m=$('#msgs');m.scrollTop=m.scrollHeight;let tm;
  $('#ce').oninput=e=>{clearTimeout(tm);tm=setTimeout(()=>{p.code={html:e.target.value,css:'',js:''};save();$('#fr').srcdoc=e.target.value},600)};
  $('#undo').onclick=()=>{if(!p.versions.length)return toast('Nothing to undo.',1);p.code={html:p.versions.pop(),css:'',js:''};save();render();toast('Reverted.')};
  $('#open').onclick=()=>{const u=URL.createObjectURL(new Blob([docOf(p)],{type:'text/html'}));window.open(u,'_blank')};
  $('#copy').onclick=()=>copy(docOf(p));
  $('#dl').onclick=()=>dl((p.name.replace(/[^\w-]+/g,'-').toLowerCase()||'site')+'.html',docOf(p),'text/html')}
 if(view==='projects'){$('#np').onclick=()=>{S.cur=null;save();view='build';render()};
  document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{S.cur=b.dataset.o;wt='preview';save();view='build';render()});
  document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const p=S.projects.find(x=>x.id===b.dataset.r),n=prompt('New name?',p.name);if(n?.trim()){p.name=n.trim();save();render()}});
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{if(confirm('Delete this project?')){S.projects=S.projects.filter(x=>x.id!==b.dataset.d);if(S.cur===b.dataset.d)S.cur=null;save();render()}})}
 if(view==='images')$('#ig').onclick=()=>{const t=$('#ip').value.trim();if(!t)return toast('Describe your image first.',1);const[w,h]=$('#iz').value.split('x'),st=$('#is').value;
  $('#io').innerHTML=[0,1].map(()=>{const u=`https://image.pollinations.ai/prompt/${encodeURIComponent(t+(st?', '+st:''))}?width=${w}&height=${h}&nologo=true&seed=${Math.floor(Math.random()*1e6)}`;return`<div class="card" style="padding:10px"><img src="${u}" alt="Generated image"><div class="row"><button data-u="${u}" class="a1">Download</button><button data-u="${u}" class="a2">Copy link</button></div></div>`}).join('');
  document.querySelectorAll('.a1').forEach(b=>b.onclick=async()=>{try{const r=await fetch(b.dataset.u),bl=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='dai-image.png';a.click()}catch(e){window.open(b.dataset.u,'_blank')}});
  document.querySelectorAll('.a2').forEach(b=>b.onclick=()=>copy(b.dataset.u))};
 if(view==='video'){$('#vg').onclick=async()=>{const t=$('#vp').value.trim();if(!t)return toast('Describe your video first.',1);$('#vg').disabled=true;$('#vo').textContent='Writing your storyboard…';
  try{$('#vo').textContent=await ask('Create a professional video storyboard for: '+t+'\nGive: title, total length, then numbered scenes each with visual description, camera shot, voiceover line, on-screen text and duration. End with music and style suggestions. Plain text only.')}catch(e){$('#vo').textContent='';toast(e.message,1)}$('#vg').disabled=false};
  $('#vc').onclick=()=>copy($('#vo').textContent)}
 if(view==='account'){$('#so').onclick=signOut;$('#ex').onclick=()=>dl('dai-studio-backup.json',JSON.stringify(S,null,2),'application/json');
  $('#as').onclick=()=>{S.settings.supabaseUrl=$('#au').value.trim();S.settings.supabaseKey=$('#ak').value.trim();save();try{connect();toast('Saved.')}catch(e){toast(e.message,1)}}}
}
/* ---- init ---- */
document.querySelectorAll('.nb').forEach(b=>b.onclick=()=>{view=b.dataset.v;render();scrollTo(0,0)});
$('#m1').onclick=()=>setMode('signup');$('#m2').onclick=()=>setMode('login');
$('#sc').onclick=()=>sendCode(false);$('#rs').onclick=()=>sendCode(true);$('#vf').onclick=verify;$('#bk').onclick=()=>{step(1);am('')};
$('#em').onkeydown=e=>{if(e.key==='Enter')sendCode(false)};$('#ot').onkeydown=e=>{if(e.key==='Enter')verify()};
$('#cu').value=S.settings.supabaseUrl||'';$('#ck').value=S.settings.supabaseKey||'';
$('#cs0').onclick=()=>{S.settings.supabaseUrl=$('#cu').value.trim();S.settings.supabaseKey=$('#ck').value.trim();save();try{am(connect()?'Connection saved. Now sign up or log in.':'Enter both the URL and key.',!sb)}catch(e){am(e.message,1)}};
if(connect()){sb.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_OUT')showAuth()});sb.auth.getSession().then(({data})=>{if(data?.session?.user)enter(data.session.user)})}
else $('#cfg').open=true;
})();
</script></body></html>
